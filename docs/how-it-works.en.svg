<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="How motion-render works: Claude writes a storyboard and script from your theme, Gemini TTS and Lyria make the voice and music, Claude Motion builds the animation, and it is rendered frame by frame to MP4"><rect width="1600" height="800" rx="36" fill="#EEF3F8"/><text x="80" y="88" font-size="52" font-weight="800" fill="#14213D">motion-render</text><text x="560" y="86" font-size="30" fill="#5B6B82">Turn a theme into an explainer video</text><rect x="80" y="150" width="300" height="300" rx="28" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="2"/><circle cx="80" cy="150" r="26" fill="#0E7C86"/><text x="80" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text><path d="M140 190 H290 L320 220 V410 H140 Z" fill="#FFFFFF" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/><path d="M290 190 V220 H320" fill="none" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/><rect x="168" y="232" width="110" height="14" rx="7" fill="#0E7C86"/><rect x="168" y="266" width="84" height="14" rx="7" fill="#C9D6E3"/><rect x="168" y="300" width="124" height="14" rx="7" fill="#0E7C86"/><rect x="168" y="334" width="70" height="14" rx="7" fill="#C9D6E3"/><rect x="168" y="368" width="100" height="14" rx="7" fill="#0E7C86"/><circle cx="308" cy="398" r="34" fill="#F2A33A"/><path d="M292 410 L296 386 L320 380 L316 404 Z" fill="#FFFFFF"/><text x="230" y="505" text-anchor="middle" font-size="30" font-weight="700" fill="#14213D">Storyboard &amp; script</text><text x="230" y="545" text-anchor="middle" font-size="22" fill="#5B6B82">Written by Claude from your theme</text><rect x="460" y="150" width="300" height="300" rx="28" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="2"/><circle cx="460" cy="150" r="26" fill="#0E7C86"/><text x="460" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text><polyline points="490,270.0 502,310 514,270 526,250.0 538,270 550,310 562,270.0 574,230 586,270 598,290.0 610,270 622,230 634,270.0 646,310 658,270 670,250.0 682,270 694,310 706,270.0 718,230 730,270" fill="none" stroke="#0E7C86" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="215" font-size="22" font-weight="700" fill="#0E7C86">voice</text><rect x="500" y="370" width="18" height="30" rx="9" fill="#F2A33A"/><rect x="530" y="346" width="18" height="54" rx="9" fill="#0E7C86"/><rect x="560" y="360" width="18" height="40" rx="9" fill="#0E7C86"/><rect x="590" y="330" width="18" height="70" rx="9" fill="#F2A33A"/><rect x="620" y="354" width="18" height="46" rx="9" fill="#0E7C86"/><rect x="650" y="338" width="18" height="62" rx="9" fill="#0E7C86"/><rect x="680" y="366" width="18" height="34" rx="9" fill="#F2A33A"/><rect x="710" y="350" width="18" height="50" rx="9" fill="#0E7C86"/><text x="490" y="345" font-size="22" font-weight="700" fill="#F2A33A">music</text><text x="610" y="505" text-anchor="middle" font-size="30" font-weight="700" fill="#14213D">Voice &amp; music</text><text x="610" y="545" text-anchor="middle" font-size="22" fill="#5B6B82">Gemini TTS + Lyria</text><rect x="840" y="150" width="300" height="300" rx="28" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="2"/><circle cx="840" cy="150" r="26" fill="#0E7C86"/><text x="840" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text><rect x="870" y="250" width="92" height="70" rx="12" fill="#CDE8EA" stroke="#0E7C86" stroke-width="3"/><rect x="1018" y="250" width="92" height="70" rx="12" fill="#CDE8EA" stroke="#0E7C86" stroke-width="3"/><path d="M968 285 H1008 M996 273 L1010 285 L996 297" fill="none" stroke="#14213D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="956" y="214" width="68" height="26" rx="13" fill="#F2A33A"/><path d="M890 380 q50 -46 100 0 t100 0" fill="none" stroke="#0E7C86"